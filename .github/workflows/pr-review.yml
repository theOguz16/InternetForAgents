name: PR review readiness
on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  pr-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # PR kodu çalıştırılmaz; açıklama yalnız veri olarak GitHub API'den okunur.
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: context.issue.number });
            const body = (pr.body || '').replace(/<!--[\s\S]*?-->/g, '');
            const errors = [];
            const required = ['İlgili issue ve kapsam', 'Ne değişti, neden?', 'Kabul kriteri → kanıt', 'Doğrulama', 'Mimari / veri etkisi', 'Riskler / kapsam dışında kalanlar', 'AI destekli teslim raporu'];
            const sections = new Map();
            for (const match of body.matchAll(/^## (.+)\r?\n([\s\S]*?)(?=^## |$(?![\s\S]))/gm)) {
              sections.set(match[1].trim(), match[2].trim());
            }
            for (const title of required) {
              const content = sections.get(title) || '';
              if (content.replace(/[-*\[\]x\s]/g, '').length < 8) errors.push(`Doldurulması gereken bölüm: ${title}`);
            }
            // Rapor eski kodu anlatıyorsa yeni push sonrası yeniden hazırlanmalıdır.
            const report = sections.get('AI destekli teslim raporu') || '';
            const reportSha = report.match(/^İncelenen commit:\s*([a-f0-9]{40})\s*$/m)?.[1];
            if (reportSha !== pr.head.sha) errors.push('AI raporundaki İncelenen commit satırı güncel PR head SHA olmalı.');
            const reportBase = report.match(/^Hedef branch:\s*(develop|main)\b/m)?.[1];
            if (reportBase !== pr.base.ref) errors.push('AI raporundaki Hedef branch PR hedefiyle aynı olmalı.');
            const scope = sections.get('İlgili issue ve kapsam') || '';
            const numbers = [...new Set([...scope.matchAll(/(?:^|\s)#(\d+)\b/g)].map(m => Number(m[1])))];
            if (!numbers.length || numbers.length > 10) errors.push('Kapsam bölümünde 1–10 yerel Issue referansı (#123) olmalı.');
            for (const issue_number of numbers.slice(0, 10)) {
              try {
                const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
                if (issue.pull_request) errors.push(`#${issue_number} bir PR; işin Issue numarasını belirt.`);
              } catch { errors.push(`#${issue_number} Issue kaydı okunamadı.`); }
            }
            await core.summary.addHeading('Review hazırlığı')
              .addRaw('Bu kontrol açıklamanın biçimini ve Issue referansını denetler. Kabul kriterlerinin gerçekten karşılandığını insan review eder.\n')
              .addList(errors.length ? errors : ['Gerekli bölümler ve Issue referansları mevcut.'])
              .write();
            if (errors.length) core.setFailed(errors.join('\n'));
