name: Build and service tests
on:
  pull_request:
    branches: [oguzhan, main]
  push:
    branches: [oguzhan]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:services
      - run: npm run validate:manifest -- examples/manifests/text-length.json text-length
